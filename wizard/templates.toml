fields = [
  { name = "task", label = "What the script does", type = "textarea", required = true },
  { name = "options", label = "Options / arguments", type = "textarea", placeholder = "-n/--dry-run, -v/--verbose, positional input dir" },
  { name = "target", label = "Target", type = "select", options = ["Linux", "Git Bash on Windows", "macOS (bash 3.2)", "POSIX sh"], required = true },
  { name = "tools", label = "Tools it may use", type = "text", placeholder = "grep, sed, awk, jq" },
]
template = '''
Write a bash script that {{task}}
Target: {{target}}
Tools it may use: {{tools}} (check that they exist at startup)

Options/arguments:
{{options}}

- Parse arguments with a `while case` loop; usage() with -h; exit codes 0 ok / 1 runtime error / 2 usage error.
- Must be shellcheck-clean. Short comments only on the non-obvious parts.
Show 3 example invocations, including a dry run.
'''

[[tasks]]
id = "bash_review"
category = "Bash"
title = "Review / harden a script"
description = "Quoting, set -e pitfalls, unsafe rm, portability."
fields = [
  { name = "target", label = "Target", type = "select", options = ["Linux", "Git Bash on Windows", "macOS (bash 3.2)", "POSIX sh"], required = true },
  { name = "script", label = "Script", type = "code", lang = "bash", required = true },
]
template = '''
Review this bash script as a strict reviewer. Target: {{target}}.
- Quoting bugs and word-splitting/globbing, unsafe rm/mv with possibly empty variables, parsing ls, `for f in $(...)` loops, missing set -euo pipefail (and where -e won't save you), cd without error handling, temp files without cleanup, race conditions, unvalidated input.
- Portability problems for the target, and what shellcheck would flag (SC codes).
List the issues by severity, then give the hardened script.

{{script}}
'''

[[tasks]]
id = "bash_debug"
category = "Bash"
title = "Debug a failing script"
description = "Use the bash -x trace to find the cause."
fields = [
  { name = "trace", label = "Output (ideally from bash -x)", type = "code", required = true },
  { name = "env", label = "Environment / how it's run", type = "text", placeholder = "Ubuntu 22.04, bash 5.1, run from cron" },
  { name = "script", label = "Script", type = "code", lang = "bash", required = true },
]
template = '''
This script fails:
{{trace}}
Environment: {{env}}

{{script}}

Find the root cause. Common suspects: a different PATH/env under cron or sudo, CRLF line endings ($'\r': command not found), unquoted variables, set -e side effects, a subshell losing variables (pipe into while).
'''

[[tasks]]
id = "bash_text"
category = "Bash"
title = "Text processing (awk/sed/jq)"
description = "Transform text or JSON with standard tools."
fields = [
  { name = "sample", label = "Input sample", type = "code", required = true },
  { name = "goal", label = "Goal", type = "textarea", required = true },
  { name = "tool", label = "Preferred tool", type = "select", options = ["awk", "sed", "jq", "plain bash", "any"] },
]
template = '''
Input sample:
{{sample}}

Goal: {{goal}}
Preferred tool: {{tool}}
Explain each part. Note any GNU vs BSD/macOS differences (sed -i, date, grep -P) that matter.
'''

# ===========================================================================
# Tasks: Gotchas (recovering from bad answers; see toolkit/05-gotchas.md)
# ===========================================================================

[[tasks]]
id = "g_resend_clean"
category = "Gotchas"
title = "Resend code without escapes / mangled tags"
description = "The code came back with \\[ \\_ escapes, auto-linked URLs or broken HTML tags."
fields = [
  { name = "files", label = "Which file(s)", type = "text", placeholder = "index.html, app.py" },
  { name = "example", label = "Example of the damage (optional)", type = "code" },
]
template = '''
The code in your last answer was damaged by formatting: Markdown escapes such as \[ \] \_ \*, URLs turned into links inside attributes/strings, or mangled HTML tags.
Files affected: {{files}}

Example:
{{example}}

Resend the complete affected file(s) inside a single fenced code block per file, with the correct language tag. Inside code: no Markdown escapes, no LaTeX, no links. Write URLs and file names as plain text exactly as they belong in the code.
'''

[[tasks]]
id = "g_continue"
category = "Gotchas"
title = "Answer was cut off"
description = "Continue a truncated answer without repeating it."
fields = [
  { name = "last_line", label = "Last complete line you received (optional)", type = "text" },
]
template = '''
Your answer was cut off. Continue exactly where you stopped. Don't repeat earlier content.
The last complete line I received was: {{last_line}}
Start a new code block, and say which file and position it continues.
'''

[[tasks]]
id = "g_no_placeholders"
category = "Gotchas"
title = "Remove '... rest unchanged' placeholders"
description = "Get the complete file when the answer omitted parts."
fields = [
  { name = "file", label = "File", type = "text", required = true },
]
template = '''
Your answer for {{file}} contains placeholders/omissions (like "... rest unchanged ..."). If I save it, real code will be deleted.
Give the COMPLETE file, every line, with no placeholders or ellipses. If it is too long for one answer, split it into numbered parts at function boundaries and tell me how many parts there are.
'''

[[tasks]]
id = "g_verify_api"
category = "Gotchas"
title = "Is this API real?"
description = "Challenge a possibly invented function, flag, config key or version."
fields = [
  { name = "thing", label = "The API / flag / option in doubt", type = "text", required = true, placeholder = "pandas DataFrame.to_markdown(index=False)" },
  { name = "version", label = "Library + version I use", type = "text" },
  { name = "error", label = "Error I got (optional)", type = "code" },
]
template = '''
I'm not sure this exists: {{thing}}
My version: {{version}}

Error:
{{error}}

1) Say honestly how confident you are that it exists in my version, and where it is documented.
2) Give me a quick way to verify it myself (a REPL command, a doc page, a source file to check).
3) If it doesn't exist or you're unsure, give an alternative that uses only APIs you are sure about.
'''

[[tasks]]
id = "g_resync"
category = "Gotchas"
title = "Resync with my current code"
description = "Copilot is editing an outdated version of your file."
fields = [
  { name = "note", label = "What changed since (optional)", type = "textarea" },
  { name = "code", label = "Current file content (or bundle files below)", type = "code" },
]
template = '''
The code you're working from is outdated. Below is the CURRENT version. Discard all earlier versions from this conversation, and base every future SEARCH block and edit on this text only.

What changed since your last answer:
{{note}}

{{code}}

Confirm by listing the functions/sections you now see, then redo your last change against this version.
'''

[[tasks]]
id = "g_search_mismatch"
category = "Gotchas"
title = "SEARCH block doesn't match"
description = "Regenerate an edit against the exact current text."
fields = [
  { name = "file", label = "File", type = "text", required = true },
  { name = "region", label = "Exact current text of that region", type = "code", required = true },
]
template = '''
Your SEARCH block for {{file}} doesn't match my file. Here is the exact current text of that region (whitespace matters):
{{region}}

Regenerate the SEARCH/REPLACE block against this text. Copy the SEARCH part character for character from it.
'''

[[tasks]]
id = "g_revert_unrelated"
category = "Gotchas"
title = "Undo unrelated changes"
description = "Copilot renamed, reformatted or 'improved' things you didn't ask for."
fields = [
  { name = "examples", label = "Unrequested changes you noticed", type = "textarea" },
]
template = '''
Your last answer changed things I didn't ask for, for example:
{{examples}}

Revert every change that isn't strictly needed for the task: no renames, reformatting, reordered imports, or added/removed comments. Give only the minimal edits for the task.
'''

[[tasks]]
id = "g_tests_weakened"
category = "Gotchas"
title = "Don't weaken the tests"
description = "Copilot changed the tests to pass instead of fixing the code."
fields = [
  { name = "failing", label = "Failing test output", type = "code" },
]
template = '''
Don't modify the tests. They describe the required behavior. Fix the implementation so they pass.

Failing output:
{{failing}}

Explain why the implementation fails the test, then give the fix to the implementation only.
'''

[[tasks]]
id = "g_ascii_output"
category = "Gotchas"
title = "Remove emoji / non-ASCII output"
description = "Windows console UnicodeEncodeError from emoji or arrows in prints and logs."
fields = [
  { name = "code", label = "Code (optional)", type = "code" },
]
template = '''
Your code prints emoji/non-ASCII symbols (like ✓ → •), which crash on my Windows console with UnicodeEncodeError. Replace them with plain ASCII in all print/log/output strings, and use ASCII only from now on in this conversation.

{{code}}
'''

# ===========================================================================
# Tasks: Other
# ===========================================================================

[[tasks]]
id = "custom"
category = "Other"
title = "Custom request"
description = "Free-form request. The primer, language, format and bundled files still apply."
fields = [
  { name = "request", label = "Request", type = "textarea", required = true },
  { name = "code", label = "Code (optional)", type = "code" },
]
template = '''
{{request}}

{{code}}
'''
